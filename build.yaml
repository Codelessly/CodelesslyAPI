targets:
  $default:
    builders:
      flutter_prop_builder:flutter_props:
        generate_for:
          - lib/src/api/nodes/text_node.dart
          - lib/src/api/nodes/button_node.dart
          - lib/src/api/nodes/row_column_node.dart
          - lib/src/api/nodes/divider_node.dart
          - lib/src/api/nodes/badge_node.dart
          - lib/src/api/nodes/app_bar_node.dart
          - lib/src/api/nodes/checkbox_node.dart
          - lib/src/api/nodes/slider_node.dart
          - lib/src/api/nodes/list_view_node.dart
          - lib/src/api/nodes/switch_node.dart
          - lib/src/api/nodes/grid_view_node.dart
          - lib/src/api/nodes/page_view_node.dart
          - lib/src/api/nodes/frame_node.dart
          - lib/src/api/nodes/chip_node.dart
          - lib/src/api/nodes/radio_node.dart
          - lib/src/api/nodes/text_field_node.dart
          - lib/src/api/nodes/dropdown_node.dart
          - lib/src/api/nodes/segmented_button_node.dart
      json_serializable:
        options:
          # explicit_to_json must be true for nested models (like a Paint inside a Frame) to serialize.
          explicit_to_json: true
          # Null values are not written, to avoid sending null properties to Firebase.
          include_if_null: false
          # The squadron library for web requires dynamic maps.
          any_map: true
