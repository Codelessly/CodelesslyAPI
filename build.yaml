      json_serializable:
        options:
          # explicit_to_json must be true for nested models (like a Paint inside a Frame) to serialize.
          explicit_to_json: true
          # Null values are not written, to avoid sending null properties to Firebase.
          include_if_null: false
          # The squadron library for web requires dynamic maps.
          any_map: true
