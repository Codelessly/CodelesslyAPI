name: codelessly_api
description: Flutter's layouts and widgets represented as models and JSON data. This API is used by the Codelessly Editor and CloudUI SDK to render Flutter Widgets.
version: 6.3.0
homepage: https://codelessly.com/
repository: https://github.com/Codelessly/CodelesslyAPI

environment:
  sdk: ^3.13.0

dependencies:
  json_annotation: ^4.12.0
  equatable: ^3.0.0
  vector_math: ^2.4.0
  collection: ^1.19.1
  meta: ^1.18.3
  intl: ^0.20.3
  path: ^1.9.1

dev_dependencies:
  json_serializable: ^6.14.1
  json_defaults_builder:
    path: tool/json_defaults_builder
  flutter_prop_builder:
    path: tool/flutter_prop_builder
  build_runner: ^2.16.2
  lints: ^6.1.0
  test: ^1.33.0
  a2ui_core: ^0.4.0

scripts: scripts.yaml
