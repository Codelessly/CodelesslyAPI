name: json_defaults_builder
description: >-
  Generates `_$<Class>OmitDefaults` functions next to json_serializable output
  so toJson can leave out fields that equal their constructor defaults.
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  analyzer: ">=14.0.0 <15.0.0"
  build: ^4.0.11
  json_annotation: ^4.12.0
  source_gen: ^4.3.0

dev_dependencies:
  lints: ^6.1.0
