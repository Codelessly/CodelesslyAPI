name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: codelessly_api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5
      - run: dart pub get
      - run: dart analyze
      - run: dart test
      # The README's and the guide's code samples.
      - run: dart run --enable-asserts example/readme.dart
      - run: dart run --enable-asserts example/example.dart
      - run: dart run --enable-asserts example/guide.dart
      - run: dart pub publish --dry-run
