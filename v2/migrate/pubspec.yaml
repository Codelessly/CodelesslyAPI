name: codelessly_migrate
description: Converts Codelessly v1 (codelessly_api 6.x) documents to the v2 format, once. Reads v1 with v1's own decoders; writes plain v2 JSON.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.9.0

dependencies:
  # v1, from this repo's root. v2 is never imported here (same package name):
  # the output is plain JSON, which v2's tests decode.
  codelessly_api:
    path: ../..
  collection: ^1.19.1

dev_dependencies:
  test: ^1.26.0
